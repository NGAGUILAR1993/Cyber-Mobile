<!doctype html><meta charset=utf-8><style>
@font-face{font-family:AN;src:url(/home/user/Cyber-Mobile/tarjetas/fuentes/Anton-Regular.ttf)}
@font-face{font-family:SG;font-weight:700;src:url(/home/user/Cyber-Mobile/scripts/redes/propuestas/2026-11-10/SpaceGrotesk-Bold.ttf)}

*{margin:0;box-sizing:border-box}body{width:1080px;height:1920px;overflow:hidden;background:#f1ebdf;font-family:SG}
#bg{position:absolute;inset:0;background:#f1ebdf;background-image:radial-gradient(#0b0b0b33 3px,transparent 3.5px);background-size:54px 54px}
#world{position:absolute;left:0;top:0;width:1080px;height:1920px;transform-origin:0 0}
svg{position:absolute;left:0;top:0;overflow:visible}
.node{position:absolute;width:330px;height:112px;margin:-56px 0 0 0;background:#fff;border:6px solid #0b0b0b;border-radius:30px;display:flex;align-items:center;gap:18px;padding:0 18px;box-shadow:8px 8px 0 #0b0b0b}
.node i{width:68px;height:68px;border-radius:18px;border:5px solid #0b0b0b;flex:none}
.node b{display:block;font-size:34px;color:#0b0b0b;line-height:1}.node small{font-size:23px;color:#444;font-weight:400}
.hub{position:absolute;width:300px;height:300px;margin:-150px 0 0 -150px;border-radius:50%;background:#0b0b0b;border:10px solid #0b0b0b;box-shadow:12px 12px 0 #ff2d1f;display:flex;align-items:center;justify-content:center;flex-direction:column;color:#f1ebdf}
.hub img{width:190px;height:190px;border-radius:50%;border:6px solid #ffd400}.hub b{font:80px AN;margin-top:-4px}
.trig{position:absolute;width:250px;height:112px;margin:-56px 0 0 0;background:#19e66b;border:6px solid #0b0b0b;border-radius:30px;font:42px AN;display:flex;align-items:center;justify-content:center;box-shadow:8px 8px 0 #0b0b0b;text-transform:uppercase}
.band{position:absolute;left:0;width:1080px;display:flex;align-items:center;justify-content:center;text-align:center;font:150px/0.95 AN;text-transform:uppercase;color:#0b0b0b;padding:0 50px}
.band .r{color:#ff2d1f}.band .y{background:#ffd400;color:#0b0b0b;padding:0 14px}
#cap{top:0;height:380px;font-size:104px;line-height:1.02}
.full{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;text-align:center;font:200px/1.04 AN;text-transform:uppercase;padding:0 50px}
.st{position:absolute;font:46px AN;background:#ff2d1f;color:#fff;padding:8px 22px;border-radius:12px;text-transform:uppercase;box-shadow:5px 5px 0 #0b0b0b}
#fin small{display:block;font:700 58px SG;margin-top:40px;text-transform:none}
</style>
<div id=bg></div>
<div id=world></div>
<div class=band id=cap></div>
<div class=full id=A style="background:#f1ebdf"></div>
<div class=full id=V style="background:#ff2d1f;color:#f1ebdf"></div>
<div id=S style="position:absolute;inset:0"></div>
<div class=full id=fin style="background:#0b0b0b;color:#f1ebdf"></div>
<script>
const $=i=>document.getElementById(i),cl=(x,a=0,b=1)=>Math.max(a,Math.min(b,x)),sm=(a,b,t)=>{const k=cl((t-a)/(b-a));return k*k*(3-2*k)};
const eo=x=>1-Math.pow(1-cl(x),3);
const TOOLS=[['VirusTotal','Links y archivos','#ff2d1f'],['PhishStats','Phishing activo','#ffd400'],['Cloudflare','Dominios seguros','#19e6c4'],
['Correos','Filtraciones','#ffd400'],['Dominios','RDAP · WHOIS','#19e6c4'],['CBU / CVU','Cuentas denunciadas','#ff2d1f'],['Teléfonos','Con denuncias','#19e66b'],
['Archivos','Malware y troyanos','#ff2d1f'],['Capturas','Lee la imagen','#ffd400'],['Audios','Transcribe','#19e6c4'],['Perfiles','Cuentas falsas','#19e66b']];
const NX=640,NY=i=>300+i*140,HUB=[330,1000];
const W=$('world');
let svg='<svg width=1080 height=1920>';
TOOLS.forEach((t,i)=>{const y=NY(i)+0;svg+=`<path id=w${i} d="M${HUB[0]+150} ${HUB[1]} C ${HUB[0]+330} ${HUB[1]}, ${NX-190} ${y}, ${NX-3} ${y}" fill=none stroke="#0b0b0b" stroke-width=8 stroke-linecap=round />`});
svg+=`<path id=wt d="M155 806 C155 860, 330 760, 330 852" stroke="#0b0b0b" stroke-width=8 fill=none stroke-linecap=round /></svg>`;
W.innerHTML=svg+`<div class=trig style="left:20px;top:750px;width:270px">WhatsApp</div><div class=hub style="left:${HUB[0]}px;top:${HUB[1]}px"><img src=vera-perfil.png><b>VERA</b></div>`+
TOOLS.map((t,i)=>`<div class=node id=n${i} style="left:${NX-3}px;top:${NY(i)}px"><i style="background:${t[2]}"></i><div><b>${t[0]}</b><small>${t[1]}</small></div></div>`).join('');
const P=[...Array(11).keys()].map(i=>$('w'+i)),PL=P.map(p=>p.getTotalLength()),wt=$('wt'),wtl=wt.getTotalLength();
const K=[[0,.9,540,1000],[6,.9,540,1000],[7,1.9,805,440],[10.5,1.9,805,440],[11.5,1.7,805,930],[15,1.7,805,930],[16,1.7,805,1490],[19.5,1.7,805,1490],[21,1.05,480,1000],[24,1.05,480,1000]];
function cam(t){let a=K[0],b=K[K.length-1];for(let i=0;i<K.length-1;i++)if(t>=K[i][0]&&t<K[i+1][0]){a=K[i];b=K[i+1];break}
 if(t>=K[K.length-1][0])return K[K.length-1];const k=sm(a[0],b[0],t);return[0,a[1]+(b[1]-a[1])*k,a[2]+(b[2]-a[2])*k,a[3]+(b[3]-a[3])*k]}
const CAP=[[6.5,10.5,'<span class=y>LINKS:</span><br>3 MOTORES<br>A LA VEZ','#ff2d1f'],[11.5,15.5,'MAILS, CBU,<br><span class=y>TELÉFONOS</span><br>Y DOMINIOS','#19e6c4'],[16.5,20.5,'ARCHIVOS,<br><span class=y>FOTOS, AUDIOS</span><br>Y PERFILES','#19e66b'],[21.5,24,'UNA IA <span class=r>ENTRENADA</span><br>ARMA<br>LA RESPUESTA','#ffd400']];
function render(t){
 const c=cam(t),s=c[1];W.style.transform=`translate(${540-s*c[2]}px,${1150-s*c[3]}px) scale(${s})`;
 const showW=t>=3;W.style.opacity=showW?1:0;$('bg').style.opacity=showW?1:0;
 const g=t-3;wt.style.strokeDasharray=wtl;wt.style.strokeDashoffset=wtl*(1-cl(g/.8));
 P.forEach((p,i)=>{p.style.strokeDasharray=PL[i];p.style.strokeDashoffset=PL[i]*(1-cl((g-.6-i*.2)/.9));const n=$('n'+i),k=eo((g-.9-i*.2)/.5);n.style.opacity=k;n.style.transform=`scale(${.6+.4*k})`;});
 // título
 $('A').style.display=t<3?'flex':'none';$('A').innerHTML=t<3?`<div>DETRÁS<br>DE <span style="color:#ff2d1f">VERA</span><br>HAY UN<br><span style="background:#ffd400;padding:0 16px;display:inline-block;margin-top:18px">MOTOR.</span></div>`:'';
 // captions
 let cc=CAP.find(x=>t>=x[0]&&t<x[1]);const cap=$('cap');cap.style.display=cc?'flex':'none';if(cc){cap.innerHTML='<div>'+cc[2]+'</div>';cap.style.background=cc[3];cap.style.color=(cc[3]=='#ff2d1f')?'#f1ebdf':'#0b0b0b';}
 // sticker
 $('S').innerHTML=(t>=3.8&&t<6.4)?`<div class=st style="left:70px;top:230px;transform:rotate(-5deg)">Así es por dentro</div>`:(t>=3.8&&t<7?'':'');
 // veredicto
 const v=$('V');v.style.display=(t>=24&&t<27.5)?'flex':'none';v.innerHTML=(t>=24&&t<27.5)?`<div>11 HERRAMIENTAS.<br><span style="color:#ffd400">1 RESPUESTA.</span><small style="display:block;font:700 56px SG;margin-top:36px;text-transform:none">🔴 Riesgo alto · 🟡 Dudoso · 🟢 Seguro</small></div>`:'';
 v.style.fontSize='170px';
 const f=$('fin');f.style.display=t>=27.5?'flex':'none';f.innerHTML=t>=27.5?`<div>ANTES DE TOCAR,<br><span style="color:#ffd400">PREGUNTALE<br>A VERA.</span><small>${(new URLSearchParams(location.search).get('canal')=='tt')?'Link en el perfil · 7 días gratis':'Comentá VERA y te envío el link · 7 días gratis'}</small></div>`:'';f.style.fontSize='140px';
}
document.fonts.ready.then(()=>{render(0);document.documentElement.setAttribute('data-listo','1')});
</script>
