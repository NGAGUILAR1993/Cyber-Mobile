<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Consulta enviada | Cyber Mobile</title>
<meta name="robots" content="noindex, nofollow">
<style>
  body{ margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center; background:#070b12; color:#eaf1fb; font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; line-height:1.6; padding:24px; }
  .box{ max-width:520px; text-align:center; }
  .tick{ width:64px; height:64px; border-radius:50%; background:rgba(40,217,210,.14); border:1px solid #28d9d2; color:#28d9d2; display:flex; align-items:center; justify-content:center; font-size:32px; margin:0 auto 20px; }
  h1{ font-size:26px; margin:0 0 10px; }
  p{ color:#c3cfe0; font-size:17px; margin:0 0 24px; }
  a.btn{ display:inline-block; background:#28d9d2; color:#05121a; font-weight:800; text-decoration:none; padding:13px 26px; border-radius:999px; }
  a.btn:hover{ background:#7cf3ee; }
</style>
</head>
<body>
  <div class="box">
    <div class="tick">✓</div>
    <h1>¡Consulta enviada!</h1>
    <p>Gracias por escribirnos. Te vamos a responder a la brevedad al correo que nos dejaste.</p>
    <a class="btn" href="/">Volver al inicio</a>
  </div>
</body>
</html>
