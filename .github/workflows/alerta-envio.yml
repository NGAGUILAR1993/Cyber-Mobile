name: Alerta semanal por WhatsApp (envío)

# Envía la alerta semanal (redes/alerta-semanal) por WhatsApp con Evolution, sin depender de n8n.
# Respaldo manual (workflow_dispatch). El resultado llega por mail y queda en redes/alerta-semanal/envios/.
# Secretos: EVOLUTION_APIKEY, ALERTA_DESTINOS (números del staff separados por coma), SMTP_USER, SMTP_PASS.
on:
  # Sin horario: el envío semanal lo hace n8n. Queda como respaldo manual.
  workflow_dispatch:
    inputs:
      modo:
        description: 'enviar | forzar (reenvía aunque ya haya salido hoy) | control'
        type: string
        default: 'enviar'

permissions:
  contents: write

concurrency:
  group: alerta-envio
  cancel-in-progress: false

jobs:
  enviar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Alerta actualizada (si la de esta semana no está, se genera)
        run: |
          FECHA=$(node -p "require('./redes/alerta-semanal/textos.json').fecha" 2>/dev/null || echo 2000-01-01)
          DIAS=$(( ( $(date -u +%s) - $(date -u -d "$FECHA" +%s) ) / 86400 ))
          echo "Alerta del $FECHA ($DIAS días)"
          if [ "$DIAS" -gt 6 ]; then
            npm install --no-save --no-package-lock playwright@1
            npx playwright install --with-deps chromium
            node scripts/alerta-semanal/generar.mjs
          fi
      - name: Instalar nodemailer
        run: npm install --no-save --no-package-lock nodemailer@6
      - name: Enviar por WhatsApp
        env:
          EVOLUTION_APIKEY: ${{ secrets.EVOLUTION_APIKEY }}
          ALERTA_DESTINOS: ${{ secrets.ALERTA_DESTINOS }}
          SMTP_USER: ${{ secrets.MONITOR_SMTP_USER }}
          SMTP_PASS: ${{ secrets.MONITOR_SMTP_PASS }}
          AVISO_A: cybermobile.ai@gmail.com
          FORZAR: ${{ inputs.modo == 'forzar' && '1' || '0' }}
          CONTROL: ${{ inputs.modo == 'control' && '1' || '0' }}
        run: node scripts/alerta-semanal/enviar.mjs
      - name: Guardar el resultado
        if: always()
        run: |
          git add -A redes/alerta-semanal
          if git diff --cached --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git commit -m "Alerta semanal: resultado del envío por WhatsApp"
          for i in 1 2 3; do
            git pull --rebase origin main && git push origin HEAD:main && break
            sleep 5
          done
