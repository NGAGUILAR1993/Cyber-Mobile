name: Traer video de bienvenida

# Uso único (26/10): baja el video de bienvenida de Vera desde Supabase y lo
# guarda en tarjetas/ dentro de esta misma rama. Se borra antes del merge.
on:
  push:
    branches: [claude/video-bienvenida]
    paths: [.github/workflows/traer-video.yml]

permissions:
  contents: write

jobs:
  traer:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Bajar y guardar
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git clone --depth 1 --branch claude/video-bienvenida "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git" repo
          cd repo
          curl -fsSL -o tarjetas/vera-bienvenida.mp4 https://swhwheusmyhaygfiypqs.supabase.co/storage/v1/object/public/Vera/vera.mp4
          ls -l tarjetas/vera-bienvenida.mp4
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add tarjetas/vera-bienvenida.mp4
          git commit -m "Video de bienvenida de Vera (copia de Supabase)"
          git push origin claude/video-bienvenida
