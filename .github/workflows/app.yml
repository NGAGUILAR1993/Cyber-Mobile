name: App Android

# Analiza, prueba y compila la app en cada cambio de la carpeta app/.
# El APK queda para descargar en la pestaña "Actions" (artefacto "cyber-mobile-apk").
on:
  push:
    branches: [main]
    paths: ['app/**', '.github/workflows/app.yml']
  pull_request:
    paths: ['app/**', '.github/workflows/app.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: '3.47.5'
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
      - name: Preparar firma de publicación (si está configurada)
        env:
          KEYSTORE_B64: ${{ secrets.CM_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/cyber-mobile.jks"
            echo "CM_KEYSTORE_PATH=$RUNNER_TEMP/cyber-mobile.jks" >> "$GITHUB_ENV"
          else
            echo "Sin keystore: el APK se firma con la clave de prueba (sirve para instalar y probar, no para Play)."
          fi
      - name: Compilar APK
        env:
          CM_KEYSTORE_PASSWORD: ${{ secrets.CM_KEYSTORE_PASSWORD }}
          CM_KEY_ALIAS: ${{ secrets.CM_KEY_ALIAS }}
          CM_KEY_PASSWORD: ${{ secrets.CM_KEY_PASSWORD }}
        run: flutter build apk --release
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: cyber-mobile-apk
          path: app/build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30
