# Mantiene observatorio/archivo.json: guarda la última versión de cada estafa del Observatorio
# para que su ficha siga publicada cuando sale del ranking. Corre cuando n8n actualiza datos.json
# y solo hace commit si el archivo cambió (pasa pocas veces: estafas nuevas o textos nuevos).
name: observatorio-archivo

on:
  push:
    branches: [main]
    paths: ['observatorio/datos.json']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: observatorio-archivo
  cancel-in-progress: false

jobs:
  archivar:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - run: node scripts/observatorio/archivar.mjs
      - name: Guardar si cambió
        run: |
          if git diff --quiet -- observatorio/archivo.json; then echo "Sin cambios"; exit 0; fi
          git config user.name "observatorio-bot"
          git config user.email "observatorio-bot@users.noreply.github.com"
          git add observatorio/archivo.json
          git commit -m "Observatorio: archivo de fichas actualizado"
          for i in 1 2 3; do git pull --rebase origin main && git push origin HEAD:main && exit 0; sleep 5; done
          exit 1
