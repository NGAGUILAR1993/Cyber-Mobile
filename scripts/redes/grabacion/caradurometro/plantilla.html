<!doctype html><html><head><meta charset="utf-8"><style>
@font-face{font-family:A;src:url(../../../../tarjetas/fuentes/Anton-Regular.ttf)}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1080px;height:1920px;overflow:hidden;background:#0b141a;font-family:Inter,"Liberation Sans",Arial,"Noto Color Emoji",sans-serif}
#cam{position:absolute;inset:0;transform-origin:540px 960px}
.sb{position:absolute;left:0;right:0;top:0;height:76px;background:#0b141a;color:#e9edef;display:flex;align-items:center;padding:0 40px;font-size:32px;font-weight:700;z-index:20}
.sb .rec{width:28px;height:28px;border-radius:50%;background:#e53935;margin-left:18px;box-shadow:0 0 0 5px rgba(229,57,53,.3)}
.sb .der{margin-left:auto;font-size:30px;letter-spacing:2px}
.hd{position:absolute;left:0;right:0;top:76px;height:170px;background:#1f2c34;z-index:20;display:flex;align-items:center;padding:0 30px;gap:24px;color:#e9edef}
.hd img{width:104px;height:104px;border-radius:50%;object-fit:cover}
.hd .n{font-size:44px;font-weight:700}.hd .e{font-size:30px;color:#8696a0;margin-top:4px}
.hd .ar{font-size:56px;color:#e9edef;margin-right:4px}
#scr{position:absolute;left:0;right:0;top:246px;bottom:0;overflow:hidden;background:#0b141a}
#scr img{position:absolute;left:0;top:0;transform-origin:0 0}
#flash{position:absolute;inset:0;background:#ff1f1f;opacity:0;z-index:40;pointer-events:none}
#fin{position:absolute;left:0;top:0;width:110px;height:110px;margin:-55px 0 0 -55px;border-radius:50%;background:rgba(255,255,255,.55);border:5px solid rgba(255,255,255,.9);z-index:45;opacity:0}
.tit{position:absolute;left:60px;right:60px;top:290px;z-index:50;display:flex;flex-direction:column;align-items:center;gap:14px}
.tag{background:#ffd60a;color:#111;font:34px A;letter-spacing:2px;padding:10px 26px;border-radius:14px;transform:rotate(-2deg)}
.note{background:#fff;color:#111;font-weight:800;font-size:66px;line-height:1.1;text-align:center;padding:30px 40px;border-radius:30px;box-shadow:0 12px 40px rgba(0,0,0,.45)}
.note em{font-style:normal;background:#ffe14d;padding:0 8px;border-radius:8px}
.note .r{color:#d50000}
#gauge{position:absolute;left:150px;width:780px;top:1180px;height:330px;background:#fff;border-radius:34px;z-index:48;box-shadow:0 12px 40px rgba(0,0,0,.5);display:flex;align-items:center;padding:0 34px;gap:26px;opacity:0}
#gauge svg{flex:none}
#gauge .lb{font:40px A;color:#111;letter-spacing:1px;line-height:1.05}
#gauge .nn{font:110px A;color:#d50000;line-height:1}
#gauge .sm{font-size:26px;color:#666;font-weight:600;margin-top:6px}
.leg{position:absolute;left:50%;transform:translateX(-50%);top:1545px;z-index:48;white-space:nowrap;font-size:28px;font-weight:700;color:#fff;background:rgba(0,0,0,.72);padding:10px 24px;border-radius:30px}
#end{position:absolute;inset:0;z-index:60;background:#f4f1ea;opacity:0;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:0 70px;gap:44px;text-align:center}
#end .big{font-weight:800;font-size:76px;line-height:1.1;color:#111}
#end .big em{font-style:normal;background:#ffe14d;padding:0 10px;border-radius:10px}
#end .cta{background:#25d366;color:#fff;font-weight:800;font-size:58px;line-height:1.15;padding:34px 40px;border-radius:30px}
#end .sub{font-size:44px;font-weight:700;color:#333}
#end img{width:170px;height:170px;border-radius:50%;object-fit:cover;border:6px solid #25d366}
#ent{position:absolute;inset:0;z-index:58;background:rgba(11,20,26,.82);opacity:0;display:flex;flex-direction:column;justify-content:center;padding:0 70px;gap:36px}
#ent .note{font-size:62px;text-align:left}
#ent .note li{list-style:none;margin:10px 0}
</style></head><body>
<div id="cam">
 <div class="sb"><span>20:14</span><span class="rec"></span><span class="der">▂▄▆█ 5G ▮</span></div>
 <div class="hd"><span class="ar">←</span><img src="img/vera.jpg"><div><div class="n">Vera</div><div class="e">en línea</div></div></div>
 <div id="scr"><img id="im" src="img/saldo.jpg"></div>
</div>
<div id="flash"></div><div id="fin"></div>
<div class="tit" id="tit"></div>
<div id="gauge"><svg width="300" height="180" viewBox="0 0 300 180">
 <defs><linearGradient id="g" x1="0" x2="1"><stop offset="0" stop-color="#2ecc40"/><stop offset=".5" stop-color="#ffcc00"/><stop offset="1" stop-color="#e00000"/></linearGradient></defs>
 <path d="M30 160 A120 120 0 0 1 270 160" fill="none" stroke="url(#g)" stroke-width="34" stroke-linecap="round"/>
 <g id="ndl"><line x1="150" y1="160" x2="150" y2="58" stroke="#111" stroke-width="10" stroke-linecap="round"/></g>
 <circle cx="150" cy="160" r="16" fill="#111"/></svg>
 <div><div class="lb">CARADURÓMETRO</div><div class="nn" id="nn">0/10</div><div class="sm">nota nuestra, no de Vera</div></div></div>
<div class="leg" id="leg">Capturas reales del chat con Vera · datos tapados</div>
<div id="ent"><div class="tag" style="align-self:flex-start">LAS 3 TIENEN LO MISMO</div>
 <div class="note"><li>⏰ Te apuran</li><li>🔗 Link o número que <span class="r">no es oficial</span></li><li>💸 Quieren que pagues o llames <em>ya</em></li></div><div class="tag" style="align-self:flex-start;background:#25d366;color:#fff">MANDALE ESTE VIDEO A TU VIEJA</div></div>
<div id="end"></div>
<script>
const Q=new URLSearchParams(location.search), CANAL=Q.get('canal')||'ig', MODO=Q.get('modo')||'';
const IMGS={saldo:[720,1285],chantaje:[720,1290],visa:[720,1272]};
// escenas: [desde, img, keyframes [t, fx, fy, zoom]]
const SC=[
 [0,'saldo',[[0,470,250,1.55],[3.4,470,255,1.75],[4.2,420,470,2.1],[6.0,420,470,2.0],[6.8,360,700,1.15],[9.4,360,1000,1.1]]],
 [9.6,'chantaje',[[9.6,460,330,1.6],[11.2,460,420,1.8],[12.6,460,470,1.7],[13.6,360,850,1.15],[16.4,360,1050,1.1]]],
 [16.6,'visa',[[16.6,560,250,1.3],[17.6,560,402,3.0],[19.6,560,402,2.9],[20.6,360,780,1.15],[23.4,360,1020,1.1]]]];
const HITS=[4.2,7.0,10.6,14.2,17.6,21.4];
const TAPS=[[3.95,520,980],[10.35,560,930],[17.35,600,990]];
const GA=[[4.0,0,8,6.7],[11.0,0,9,13.7],[18.0,0,10,20.7]];
const TITS=[
 [-1,3.9,'CARADURÓMETRO · EP. 1','Te hacen <em>40% de descuento</em> en una deuda que no tenés'],
 [3.9,6.6,'ESTAFA 1 · SMS','Primero te amenaza. Después te hace <em>una oferta</em>.'],
 [6.6,9.6,'LA RESPUESTA DE VERA','<span class="r">🔴 Riesgo ALTO.</span> Los links son .bond y .online'],
 [9.6,12.4,'ESTAFA 2 · MAIL','Dice que te ve <em>por la cámara</em>'],
 [12.4,13.6,'ESTAFA 2 · MAIL','Y te lo dice en inglés'],
 [13.6,16.6,'LA RESPUESTA DE VERA','<span class="r">🔴 Chantaje masivo.</span> No te eligió a vos'],
 [16.6,19.2,'ESTAFA 3 · MAIL','<em>$855.733</em> en una compra que no hiciste'],
 [19.2,20.6,'LA MÁS PELIGROSA','Quiere que <em>vos</em> llames'],
 [20.6,23.6,'LA RESPUESTA DE VERA','<span class="r">🔴 Vishing.</span> El número es un celular particular']];
const ENT=[23.6,27];
const ez=x=>x<0?0:x>1?1:x<.5?2*x*x:1-Math.pow(-2*x+2,2)/2;
const $=id=>document.getElementById(id);
let cur='';
function camAt(kf,t){let a=kf[0],b=kf[kf.length-1];for(let i=0;i<kf.length-1;i++)if(t>=kf[i][0]&&t<=kf[i+1][0]){a=kf[i];b=kf[i+1];break}
 if(t<kf[0][0])return kf[0].slice(1); if(t>b[0])return b.slice(1);
 const p=ez((t-a[0])/(b[0]-a[0]||1));return [a[1]+(b[1]-a[1])*p,a[2]+(b[2]-a[2])*p,a[3]+(b[3]-a[3])*p]}
function render(t){
 let s=SC[0];for(const x of SC)if(t>=x[0])s=x;
 const im=$('im');if(cur!==s[1]){im.src='img/'+s[1]+'.jpg';cur=s[1]}
 const [W,H]=IMGS[s[1]];let [fx,fy,z]=camAt(s[2],t);
 // ruido de mano
 fx+=Math.sin(t*1.7)*3;fy+=Math.cos(t*1.3)*3;
 const k=1.5*z, SH=1674, cy=780;
 let L=540-fx*k, T=cy-fy*k; L=Math.min(0,Math.max(1080-W*k,L)); T=Math.min(0,Math.max(SH-H*k,T));
 im.style.transform=`translate(${L}px,${T}px) scale(${k})`;
 // golpes
 let sh=0,fl=0;for(const h of HITS){const d=t-h;if(d>=0&&d<.5){sh+=Math.exp(-d*9)*22*Math.sin(d*70);fl=Math.max(fl,.45*Math.exp(-d*8))}}
 // corte entre escenas: zoom rápido
 let cz=1;for(const x of SC.slice(1)){const d=t-x[0];if(d>=-.15&&d<.25)cz=1+.08*Math.cos(Math.PI*Math.min(1,Math.abs(d)/.25)*.5)}
 $('cam').style.transform=`translate(${sh}px,${sh*.4}px) scale(${cz})`;$('flash').style.opacity=fl;
 // dedo
 let fo=0,fxp=0,fyp=0,fs=1;for(const [tt,x,y] of TAPS){const d=t-tt;if(d>-.45&&d<.35){fo=d<0?1+d/.45*0:1-d/.35;fxp=x+(d<0?-d*260:0);fyp=y+(d<0?-d*420:0);fs=d>=0&&d<.15?.8:1}}
 const fn=$('fin');fn.style.opacity=MODO?0:fo;fn.style.transform=`translate(${fxp}px,${fyp}px) scale(${fs})`;
 // medidor
 let go=0,val=0;for(const [a,v0,v1,b] of GA){if(t>=a&&t<b){go=Math.min(1,(t-a)/.3)*Math.min(1,(b-t)/.3);val=v0+(v1-v0)*ez((t-a-.2)/1.4)+(t-a>1.6?Math.sin((t-a)*18)*.12:0)}}
 $('gauge').style.opacity=MODO?0:go;$('gauge').style.transform=`translateY(${(1-go)*60}px)`;
 $('ndl').setAttribute('transform',`rotate(${-90+val*18} 150 160)`);$('nn').textContent=Math.round(val)+'/10';
 // títulos
 let tt=null;for(const x of TITS)if(t>=x[0]&&t<x[1])tt=x;
 const el=$('tit');
 if(tt&&!MODO){const key=tt[2]+tt[3];if(el.dataset.k!==key){el.innerHTML=`<div class="tag">${tt[2]}</div><div class="note">${tt[3]}</div>`;el.dataset.k=key}
  const d=t-tt[0];const p=tt[0]<0?1:Math.min(1,d/.25);el.style.opacity=Math.min(p,(tt[1]-t)/.15);el.style.transform=`scale(${.9+.1*ez(p)})`}
 else el.style.opacity=0;
 // entrega y cierre
 const e=(t-ENT[0]);$('ent').style.opacity=MODO?0:(e>=0&&t<ENT[1]+.4?Math.min(1,e/.35):0);
 const f=t-ENT[1];$('end').style.opacity=MODO?0:(f>=0?Math.min(1,f/.35):0);
 $('leg').style.opacity=(t<ENT[0]&&!MODO)?.95:0;
}
const END={ig:`<img src="img/vera.jpg"><div class="big">¿Te llegó una <em>más caradura</em>? Mandámela por DM y el jueves la medimos</div><div class="cta">Comentá VERA y te envío el link por privado (7 días gratis)</div>`,
 wa:`<img src="img/vera.jpg"><div class="big">Antes de pagar o llamar, <em>preguntale a Vera</em></div><div class="cta">Probala 7 días gratis<br>+54 9 11 7059-8505</div><div class="sub">cybermobile.com.ar</div>`,
 tt:`<img src="img/vera.jpg"><div class="big">¿Te llegó una <em>más caradura</em>? Contámela en los comentarios</div><div class="cta">Link en el perfil · 7 días gratis</div>`};
$('end').innerHTML=END[CANAL]||END.ig;
Promise.all([...document.images].map(i=>i.decode().catch(()=>0))).then(()=>{['chantaje','visa'].forEach(n=>{const i=new Image();i.src='img/'+n+'.jpg'});document.fonts.ready.then(()=>{render(0);document.documentElement.dataset.listo=1})});
</script></body></html>
