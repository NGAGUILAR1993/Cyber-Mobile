<!doctype html><html><head><meta charset="utf-8"><style>
@font-face{font-family:A;src:url(/tarjetas/fuentes/Anton-Regular.ttf)}
@font-face{font-family:G;src:url(/tarjetas/fuentes/SpaceGrotesk-Regular.ttf)}
@font-face{font-family:G;font-weight:700;src:url(/tarjetas/fuentes/SpaceGrotesk-Bold.ttf)}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1080px;height:1920px;overflow:hidden;background:#000}
#bg{position:absolute;inset:0;width:1080px;height:1920px;object-fit:cover}
#sh{position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,0) 0,rgba(0,0,0,.0) 30%,rgba(0,0,0,.25) 100%)}
.box{position:absolute;left:70px;right:70px;text-align:center}
.l{display:inline;background:#fff;color:#0b0f1a;font-family:G,"Noto Color Emoji";font-weight:700;line-height:1.38;padding:6px 24px;border-radius:18px;-webkit-box-decoration-break:clone;box-decoration-break:clone}
.s{display:inline-block;background:#22D3EE;color:#04121A;font-family:G,"Noto Color Emoji";font-weight:700;font-size:48px;padding:10px 26px;border-radius:16px;margin-top:26px}
.dash{position:absolute;left:150px;right:150px;border:6px dashed rgba(255,255,255,.9);border-radius:36px;background:rgba(0,0,0,.35);color:#fff;font-family:G;font-size:36px;display:flex;align-items:center;justify-content:center;text-align:center;line-height:1.3}
.lk{position:absolute;left:300px;right:300px;height:110px;border-radius:55px;background:rgba(255,255,255,.92);color:#0b0f1a;font-family:G;font-weight:700;font-size:36px;display:flex;align-items:center;justify-content:center}
</style></head><body>
<img id="bg"><div id="sh"></div><div id="c"></div>
<script>
const q=new URLSearchParams(location.search);
document.getElementById('bg').src=q.get('img');
document.getElementById('c').innerHTML=decodeURIComponent(q.get('html'));
document.fonts.ready.then(()=>{const i=document.getElementById('bg');(i.complete?Promise.resolve():new Promise(r=>i.onload=r)).then(()=>document.documentElement.dataset.listo=1)});
</script></body></html>
