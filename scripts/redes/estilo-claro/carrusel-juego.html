<!doctype html>
<html lang="es"><head><meta charset="utf-8">
<style>
@font-face{font-family:G;src:url(/home/user/Cyber-Mobile/tarjetas/fuentes/SpaceGrotesk-Regular.ttf)}
@font-face{font-family:G;font-weight:700;src:url(/home/user/Cyber-Mobile/tarjetas/fuentes/SpaceGrotesk-Bold.ttf)}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1080px;overflow:hidden}
body{font-family:G;color:#111b21;background:#f4efe6}
body.c{height:1350px}body.h{height:1920px}
.pag{position:absolute;left:70px;right:70px;display:flex;flex-direction:column}
body.c .pag{top:70px;bottom:70px;justify-content:center}
body.c .top{position:absolute;top:0;left:0;right:0}
body.h .pag{top:200px;bottom:300px;justify-content:center}
.top{display:flex;justify-content:space-between;align-items:center;font-size:26px;font-weight:700;color:#54656f}
.top img{width:44px;height:44px;border-radius:10px;vertical-align:middle;margin-right:12px}
.pill{background:#111b21;color:#fff;border-radius:30px;padding:8px 20px;font-size:24px}
.nota{background:#fff;border-radius:26px;padding:28px 34px;font-size:54px;line-height:1.14;font-weight:700;box-shadow:0 8px 30px rgba(0,0,0,.08);margin-top:26px}
.nota small{display:block;font-size:31px;font-weight:400;color:#54656f;margin-top:10px;line-height:1.3}
.rojo{color:#e02424}.verde{color:#128c4a}.cian{color:#0a8fb0}
.wa{margin-top:26px;border-radius:28px;overflow:hidden;box-shadow:0 14px 50px rgba(0,0,0,.14);font-family:'Liberation Sans',Arial,sans-serif;position:relative}
.cab{background:#008069;color:#fff;display:flex;align-items:center;gap:18px;padding:20px 24px}
.av{width:64px;height:64px;border-radius:32px;background:#dfe5e7;display:flex;align-items:center;justify-content:center;font-size:34px}
.cab b{font-size:33px;display:block}.cab small{font-size:24px;opacity:.85}
.fondo{background:#efeae2;padding:24px 22px 28px}
.b{max-width:96%;background:#fff;border-radius:0 22px 22px 22px;padding:20px 24px 10px;font-size:40px;line-height:1.36;box-shadow:0 1px 1px rgba(0,0,0,.08)}
.b .h{display:block;text-align:right;font-size:21px;color:#667781;margin-top:2px}
.lnk{color:#027eb5;text-decoration:underline}
/* resaltado de la trampa: marcador rojo */
.t{border-radius:8px;padding:0 4px;transition:none}
.on{background:rgba(224,36,36,.16);outline:5px solid #e02424;outline-offset:2px;border-radius:10px}
.cab .on{background:rgba(255,255,255,.18);outline-color:#ffd166}
.n{position:absolute;width:74px;height:74px;border-radius:37px;background:#e02424;color:#fff;font-size:42px;font-weight:700;display:flex;align-items:center;justify-content:center;box-shadow:0 6px 20px rgba(224,36,36,.4);font-family:G}
.exp{margin-top:34px;background:#fff;border-left:12px solid #e02424;border-radius:22px;padding:26px 30px;font-size:38px;line-height:1.3;box-shadow:0 6px 20px rgba(0,0,0,.06)}
.exp b{display:block;font-size:46px;margin-bottom:6px}
.puntos{display:flex;flex-direction:column;gap:16px;margin-top:26px}
.puntos div{background:#fff;border-radius:22px;padding:20px 26px;font-size:36px;display:flex;gap:20px;align-items:center;box-shadow:0 6px 20px rgba(0,0,0,.06)}
.puntos span{font-weight:700;font-size:40px;min-width:120px}
.cta{margin-top:34px;background:#06080d;color:#fff;border-radius:28px;padding:30px 34px}
.cta .tt{font-size:56px;font-weight:700;line-height:1.1}.cta .tt span{color:#33c6e8}
.cta .s{font-size:32px;color:#b9c0cc;margin-top:8px}
.desliza{margin-top:22px;text-align:right;font-size:34px;font-weight:700;color:#0a8fb0}
.etq{font-size:22px;color:#667781;margin-top:12px;text-align:center}
</style></head>
<body><div id="raiz"></div>
<script>
const q = new URLSearchParams(location.search), modo = q.get('modo'), fmt = q.get('fmt') || 'c';
document.body.classList.add(fmt);
const LOGO = '/home/user/Cyber-Mobile/logo-cm.png';
const TRAMPAS = [
  { t: 'Un número común con nombre de banco', d: 'Le pusieron "Banco" y un ✅ al nombre, pero es un celular cualquiera. El nombre del chat lo elige quien escribe.' },
  { t: 'Te apuran para que no pienses', d: '"Bloqueo TOTAL en 2 horas". El miedo y el reloj son la herramienta número uno del estafador.' },
  { t: 'El link no es del banco', d: 'Mirá el dominio: "tubanco-validacion.com" no es la web oficial. Entrá siempre escribiendo vos la dirección o desde la app.' },
  { t: 'Te piden el código del SMS', d: 'Ese código es la llave de tu cuenta. Ningún banco te lo pide por chat, ni por teléfono, ni por mail.' },
  { t: 'No sabe ni tu nombre', d: '"Estimado cliente" y un "acceso inusual" sin ningún dato: te escribe alguien que no te conoce. Los avisos reales de tu banco llegan en su app.' }
];
const sel = (i) => (k) => (i === k ? ' on' : '');
function chat(i) {
  const s = sel(i);
  return `<div class="wa"><div class="cab"><div class="av">🏦</div><div><b class="t${s(0)}">Soporte Banco ✅</b><small>+54 9 11 •••• ••••</small></div></div>
  <div class="fondo"><div class="b"><span class="t${s(4)}">Estimado cliente: detectamos un acceso inusual a su cuenta.</span> <span class="t${s(1)}">Para evitar el bloqueo TOTAL en 2 horas</span>, valide su identidad en <span class="t${s(2)}"><span class="lnk">tubanco-validacion.com</span></span> <span class="t${s(3)}">y envíenos el código que le llegará por SMS.</span> Atte. Seguridad Bancaria<span class="h">09:12</span></div></div></div>`;
}
const cabeza = (k) => `<div class="top"><span><img src="${LOGO}">Cyber Mobile · Vera</span><span class="pill">${k}</span></div>`;
let h;
if (modo === 'portada') {
  h = `${cabeza('JUEGO')}<div class="nota">Este mensaje tiene <span class="rojo">5 trampas</span>. ¿Cuántas encontrás?<small>Contalas antes de deslizar. Después te las mostramos una por una.</small></div>${chat(-1)}<div class="etq">Mensaje recreado de un caso típico · número tapado</div><div class="desliza">Deslizá 👉</div>`;
} else if (modo === 'historia') {
  h = `${cabeza('JUEGO')}<div class="nota">Este mensaje tiene <span class="rojo">5 trampas</span>. ¿Cuántas ves?<small>La respuesta está en el carrusel de hoy 👇</small></div>${chat(-1)}<div class="nota" style="font-size:40px;text-align:center;border:4px dashed #b9c0cc;box-shadow:none;background:transparent;color:#667781">Acá va la encuesta: 1-2 · 3-4 · ¡las 5!</div>`;
} else if (modo === 'final') {
  h = `${cabeza('RESULTADO')}<div class="nota">¿Cuántas encontraste?</div>
  <div class="puntos"><div><span class="verde">5/5</span>Sos difícil de estafar. Mandáselo a alguien que no lo sea.</div><div><span class="cian">3-4</span>Bien, pero una sola que se te pasa alcanza para que te vacíen la cuenta.</div><div><span class="rojo">0-2</span>Antes de tocar cualquier link, reenviáselo a Vera.</div></div>
  <div class="cta"><div class="tt">Comentá <span>VERA</span></div><div class="s">y te envío el link por privado · 7 días gratis</div></div>`;
} else {
  const i = Number(modo);
  h = `${cabeza('TRAMPA ' + (i + 1) + ' DE 5')}${chat(i)}<div class="exp"><b><span class="rojo">${i + 1}.</span> ${TRAMPAS[i].t}</b>${TRAMPAS[i].d}</div>`;
}
document.getElementById('raiz').innerHTML = `<div class="pag">${h}</div>`;
document.fonts.ready.then(() => Promise.all([...document.images].map(i => i.decode().catch(() => {})))).then(() => document.documentElement.dataset.listo = '1');
</script></body></html>
