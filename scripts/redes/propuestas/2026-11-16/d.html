<!doctype html><meta charset=utf-8><style>
@font-face{font-family:AN;src:url(/home/user/Cyber-Mobile/tarjetas/fuentes/Anton-Regular.ttf)}
@font-face{font-family:SG;font-weight:700;src:url(/home/user/Cyber-Mobile/scripts/redes/propuestas/2026-11-10/SpaceGrotesk-Bold.ttf)}
*{margin:0;box-sizing:border-box}body{width:1080px;height:1920px;font-family:SG;background:#f1ebdf;position:relative;overflow:hidden;color:#0b0b0b}
.t{position:absolute;left:60px;right:60px;top:100px;font:150px/1.04 AN;text-transform:uppercase}.t .y{background:#ffd400;padding:0 12px;display:inline-block;margin-top:8px}
.s{position:absolute;left:60px;right:60px;bottom:90px;font:700 50px/1.25 SG}
.tag{position:absolute;top:50px;left:60px;font:700 32px SG;letter-spacing:4px;text-transform:uppercase}
.g{position:absolute;left:60px;right:60px;top:640px;display:grid;grid-template-columns:repeat(7,1fr);gap:20px}
.w{aspect-ratio:1;background:#0b0b0b;border-radius:10px}.r{background:#ff2d1f;box-shadow:0 0 0 8px #ff2d1f55}.v{background:#19e66b}.a{background:#ffd400}
.bub{position:absolute;background:#fff;border:5px solid #0b0b0b;border-radius:26px;padding:22px 30px;font:700 46px/1.2 SG;box-shadow:8px 8px 0 #0b0b0b}
</style>
<div id=app></div>
<script>
const n=+location.hash.slice(1)||1;const A=document.getElementById('app');
const cells=(f)=>Array.from({length:49},(_,i)=>`<div class="w ${f(i)}"></div>`).join('');
if(n==1)A.innerHTML=`<div class=tag>1 de 3</div><div class=t>Le llega una estafa a <span class=y>una persona.</span></div><div class=g style="top:700px">${cells(i=>i==24?'r':'')}</div><div class=s>Una ventana entre miles. Nadie más lo sabe.</div>`;
if(n==2)A.innerHTML=`<div class=tag>2 de 3</div><div class=t>Ella <span class=y>pregunta</span> a Vera.</div><div class=g style="top:700px">${cells(i=>[24,17,23,25,31].includes(i)?'v':'')}</div><div class=bub style="left:110px;top:1640px">🔴 ES ESTAFA. No toques el link.</div><div class=s>Y avisa a su familia: se contagia el cuidado.</div>`;
if(n==3)A.innerHTML=`<div class=tag>3 de 3</div><div class=t>Y avisan a <span class=y>los vecinos.</span></div><div class=g style="top:560px">${cells(i=>(i*7%11<9)?'v':'')}</div><div class=s style="font:120px/1 AN;text-transform:uppercase;color:#0b0b0b">Cuidémonos<br>entre todos.</div>`;
document.documentElement.setAttribute('data-listo',1)</script>
