const P=(x,y,l,c='#19e66b',r=44)=>`<circle cx=${x} cy=${y} r=${r} fill=${c} filter=url(#gl) /><text x=${x} y=${y+9} text-anchor=middle font-size=${r*0.8} >${l}</text>`;

 let s=`<svg viewBox="0 0 1080 1920">${defs}`;ps.forEach(p=>s+=`<line x1=${cx} y1=${cy} x2=${p[0]} y2=${p[1]} stroke=#19e66b stroke-width=6 filter=url(#gl) stroke-dasharray="4 18" />`);
 s+=`<circle cx=${cx} cy=${cy} r=120 fill=none stroke=#19e66b stroke-width=4 opacity=.6 /><circle cx=${cx} cy=${cy} r=76 fill=#19e66b filter=url(#gl) /><text x=${cx} y=${cy+22} text-anchor=middle font-size=64>📱</text>`;
 ps.forEach(p=>s+=P(p[0],p[1],p[2]));s+='</svg>';
 A.innerHTML=hud('REENVÍO','ALERTA EN CAMINO')+`<div class=t>Lo <span class=g>reenvía</span> a su familia y amigos.</div>`+s+ps.map(p=>`<div class=lbl style="left:${p[0]}px;top:${p[1]+60}px">${p[3]}</div>`).join('')+`<div class=s><b>“Ojo: es una estafa.”</b> Un reenvío y ya no es solo suyo.</div>`}

if(n==3){let sd=7;const rnd=()=>{sd|=0;sd=sd+0x6D2B79F5|0;let t=Math.imul(sd^sd>>>15,1|sd);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296};
 const N=[[540,1050]];for(let i=0;i<70;i++){let x,y,ok;do{x=70+rnd()*940;y=560+rnd()*1000;ok=N.every(p=>Math.hypot(p[0]-x,p[1]-y)>95)}while(!ok);N.push([x,y])}
 const d=p=>Math.hypot(p[0]-540,p[1]-1050);const lit=p=>d(p)<470;
 const L=[];N.forEach((p,i)=>{N.map((q,j)=>[j,Math.hypot(p[0]-q[0],p[1]-q[1])]).filter(x=>x[0]!=i).sort((a,b)=>a[1]-b[1]).slice(0,2).forEach(x=>{if(x[1]<210&&i<x[0])L.push([i,x[0]])})});
 let s=`<svg viewBox="0 0 1080 1920">${defs}`;L.forEach(([i,j])=>{const a=N[i],b=N[j],on=lit(a)&&lit(b);s+=`<line x1=${a[0]} y1=${a[1]} x2=${b[0]} y2=${b[1]} stroke=${on?'#19e66b':'#19e6c4'} stroke-width=${on?4:2} opacity=${on?.95:.3} ${on?'filter=url(#gl)':''} />`});
