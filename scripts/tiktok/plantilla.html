<!doctype html>
<html lang="es"><head><meta charset="utf-8">
<!-- Plantilla de los videos de TikTok "¿Estafa o real?" (1080x1920). La usa scripts/tiktok/generar.mjs. -->
<style>
@font-face{font-family:G;src:url(../../tarjetas/fuentes/SpaceGrotesk-Regular.ttf)}
@font-face{font-family:G;font-weight:700;src:url(../../tarjetas/fuentes/SpaceGrotesk-Bold.ttf)}
/* Estilo claro (16/10): fondo crema, chats de WhatsApp en modo claro y notas blancas, como una captura que te manda un amigo. */
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1080px;height:1920px;overflow:hidden}
body{font-family:G;color:#111b21;background:#f4efe6}
/* Zona segura de TikTok: arriba la barra, a la derecha los botones, abajo el texto de la publicación */
.pag{position:absolute;left:70px;right:170px;top:200px;bottom:440px;display:flex;flex-direction:column}
.marca{display:flex;align-items:center;gap:14px;font-size:28px;font-weight:700;color:#54656f}
.marca img{width:50px;height:50px;border-radius:10px}
.cuerpo{flex:1;display:flex;flex-direction:column;justify-content:center}
.h{font-weight:700;line-height:1.08;background:#fff;border-radius:28px;padding:30px 36px;box-shadow:0 8px 30px rgba(0,0,0,.08)}
.rojo{color:#e02424}.cian{color:#0a8fb0}.verde{color:#128c4a}.gris{color:#54656f}
.txt{font-size:44px;line-height:1.28}
.chip{align-self:flex-start;background:#e02424;color:#fff;border-radius:12px;padding:10px 22px;font-size:28px;font-weight:700;letter-spacing:2px}
.nro{align-self:flex-start;font-size:56px;font-weight:700;color:#fff;background:#0a8fb0;border-radius:40px;width:80px;height:80px;display:flex;align-items:center;justify-content:center}
.tel{border-radius:30px;overflow:hidden;box-shadow:0 14px 50px rgba(0,0,0,.14);margin-top:24px}
.cab{display:flex;align-items:center;gap:20px;background:#008069;color:#fff;padding:22px 26px;font-family:'Liberation Sans',Arial,sans-serif}
.av{width:70px;height:70px;border-radius:35px;background:#dfe5e7;display:flex;align-items:center;justify-content:center;font-size:38px}
.cab b{font-size:34px;display:block}.cab small{font-size:25px;opacity:.85}
.fondo{padding:30px 24px 36px;background:#efeae2}
.burb{background:#fff;border-radius:0 24px 24px 24px;padding:22px 26px 12px;font-family:'Liberation Sans',Arial,sans-serif;font-size:41px;line-height:1.3;color:#111b21;max-width:96%;box-shadow:0 1px 1px rgba(0,0,0,.08)}
.burb .hora{display:block;text-align:right;font-size:23px;color:#667781;margin-top:4px}
.lnk{color:#027eb5;text-decoration:underline}
.preg{margin-top:30px;font-size:64px;font-weight:700;text-align:center;background:#fff;border-radius:24px;padding:18px;box-shadow:0 6px 20px rgba(0,0,0,.06)}
.preg span{padding:0 6px}
.res div{display:flex;gap:20px;align-items:flex-start;margin-top:22px;font-size:37px;line-height:1.25;background:#fff;border-radius:22px;padding:20px 24px;box-shadow:0 6px 20px rgba(0,0,0,.06)}
.res .n{flex:0 0 60px;height:60px;border-radius:30px;display:flex;align-items:center;justify-content:center;font-size:34px;font-weight:700;color:#fff;padding:0;box-shadow:none;margin:0}
.res b{font-size:44px;display:block}
.cta{margin-top:34px;background:#06080d;color:#fff;border-radius:28px;padding:32px 36px}
.cta .t{font-size:58px;font-weight:700;line-height:1.08}
.cta .t .cian{color:#33c6e8}
.cta .s{font-size:34px;color:#b9c0cc;margin-top:10px}
.nota{font-size:24px;color:#667781;margin-top:18px}
</style></head>
<body><div id="raiz"></div>
<script>
// generar.mjs llama a pintar(modo, episodio) y espera html[data-listo].
const esc = (t) => String(t ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const marca = '<div class="marca"><img src="../../logo-cm.png">Cyber Mobile · Vera</div>';
const preg = '<div class="preg"><span class="rojo">¿ESTAFA</span> O <span class="verde">REAL?</span></div>';
const COLORES = ['', 'cian', '', 'verde'];
function chat(m) {
  const link = m.link ? ` <span class="lnk">${esc(m.link)}</span>` : '';
  return `<div class="tel"><div class="cab"><div class="av">${esc(m.icono)}</div><div><b>${esc(m.nombre)}</b><small>${esc(m.sub)}</small></div></div>
    <div class="fondo"><div class="burb">${esc(m.texto)}${link}<span class="hora">${esc(m.hora)}</span></div></div></div>`;
}
function pintar(modo, ep) {
  let h;
  if (modo === 'portada') {
    const lineas = ep.portada.map((l, i) => `<span class="${COLORES[i] || ''}">${esc(l)}</span>`).join('<br>');
    h = `<div class="chip">●  TEST DE 20 SEGUNDOS</div>
      <div class="h" style="font-size:92px;margin-top:30px">${lineas}</div>
      <div class="txt gris" style="margin-top:44px">¿Lo encontrás antes que <b class="cian">Vera</b>? 👀</div>
      <div class="nota">Mensajes recreados de casos reales en Argentina</div>`;
  } else if (modo.startsWith('m')) {
    const i = Number(modo.slice(1));
    h = `<div class="nro">${i + 1}</div>${chat(ep.mensajes[i])}${preg}`;
  } else if (modo === 'respuestas') {
    h = `<div class="h" style="font-size:76px">LAS <span class="cian">RESPUESTAS</span></div><div class="res">` +
      ep.respuestas.map((r, i) => `<div><span class="n" style="background:${r.real ? '#25d366' : '#ff3b3b'}">${i + 1}</span><span><b class="${r.real ? 'verde' : 'rojo'}">${r.real ? '🟢' : '🔴'} ${esc(r.titulo)}</b>${esc(r.texto)}</span></div>`).join('') + '</div>';
  } else {
    h = `<div class="h" style="font-size:80px">¿TE LLEGÓ ALGO <span class="rojo">RARO</span>?</div>
      <div class="txt" style="margin-top:30px">Mandáselo a <b class="cian">Vera</b> por WhatsApp y en segundos te dice si es estafa. 🔴🟡🟢</div>
      <div class="cta"><div class="t">PROBALA <span class="cian">7 DÍAS GRATIS</span></div><div class="s">cybermobile.com.ar/vera</div></div>
      <div class="txt gris" style="margin-top:26px;font-size:40px">Link en el perfil 👆 · Comentá cuántas acertaste</div>`;
  }
  delete document.documentElement.dataset.listo;
  document.getElementById('raiz').innerHTML = `<div class="pag">${marca}<div class="cuerpo">${h}</div></div>`;
  return document.fonts.ready.then(() => Promise.all([...document.images].map((i) => i.decode().catch(() => {})))).then(() => { document.documentElement.dataset.listo = '1'; });
}
</script></body></html>
